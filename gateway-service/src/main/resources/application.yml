spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: productos-route
              uri: ${PRODUCTOS_URL:http://localhost:8181}
              predicates:
                - Path=/api/productos,/api/productos/**
            - id: pedidos-route
              uri: ${PEDIDOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/pedidos,/api/pedidos/**
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
